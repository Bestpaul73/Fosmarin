<svg viewBox="-2 8 184 184" xmlns="http://www.w3.org/2000/svg"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17324a"/>
      <stop offset="100%" stop-color="#0a1a2b"/>
    </linearGradient>
  </defs>

  <!-- Icon panel, matches the dashboard card on the site -->
  <rect x="0" y="10" width="180" height="180" rx="20" fill="url(#panelGrad)" stroke="#2c4a63" stroke-width="1"/>

  <!-- Sea wave pattern -->
  <g stroke="#5EEAD4" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M14 44 Q 27 34 40 44 T 66 44 T 92 44 T 118 44 T 144 44 T 168 44" opacity="0.35"/>
    <path d="M14 58 Q 27 50 40 58 T 66 58 T 92 58 T 118 58 T 144 58 T 168 58" opacity="0.55"/>
    <path d="M14 72 Q 27 64 40 72 T 66 72 T 92 72 T 118 72 T 144 72 T 168 72" opacity="0.8"/>
  </g>

  <!-- Cable route -->
  <path d="M20 118 C 55 104, 85 128, 112 114 C 140 100, 146 88, 168 72"
        stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Sensing ping (thin concentric arcs, same idiom as the site's radar mark) -->
  <g stroke="#5EEAD4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
    <circle cx="72" cy="115" r="10"/>
    <circle cx="72" cy="115" r="17" opacity="0.5"/>
  </g>

  <!-- Sensing nodes along the cable -->
  <circle cx="40" cy="113" r="3.5" fill="#5EEAD4"/>
  <circle cx="72" cy="115" r="4" fill="#5EEAD4"/>
  <circle cx="112" cy="114" r="3.5" fill="#F59E0B"/>
  <circle cx="168" cy="72" r="4" fill="#5EEAD4"/>

</svg>
